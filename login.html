<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EngagePriority Control Tower Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #07111f;
      color: #0f172a;
      margin: 0;
    }

    .gradient-bg {
      background:
        radial-gradient(circle at 20% 10%, rgba(20, 184, 166, 0.16) 0%, rgba(20, 184, 166, 0) 32%),
        radial-gradient(circle at 80% 0%, rgba(56, 189, 248, 0.12) 0%, rgba(56, 189, 248, 0) 30%),
        linear-gradient(135deg, #07111f 0%, #0f172a 48%, #111827 100%);
    }

    .login-card {
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid rgba(226, 232, 240, 0.95);
      box-shadow: 0 28px 80px rgba(2, 6, 23, 0.35);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0f766e, #0891b2);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -10px rgba(8, 145, 178, 0.55);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      cursor: not-allowed;
      opacity: 0.7;
      transform: none;
      box-shadow: none;
    }
  </style>
</head>
<body class="antialiased selection:bg-cyan-500 selection:text-white">
  <main class="min-h-screen flex items-center justify-center px-4 py-10 gradient-bg">
    <section class="w-full max-w-md">
      <div class="mb-7 text-center text-white">
        <div class="flex justify-center mb-6">
          <img src="assets/engagepriority-header-logo.png" alt="EngagePriority" class="h-11 w-auto" />
        </div>

        <p class="text-sm uppercase tracking-[0.25em] text-cyan-200 font-semibold mb-3">
          CONTROL TOWER
        </p>

        <h1 class="text-3xl font-bold tracking-tight">
          Client Login
        </h1>

        <p class="mt-4 text-sm text-slate-300">
          Access your EngagePriority Control Tower
        </p>
      </div>

      <div class="login-card rounded-3xl p-7 shadow-2xl">
        <form id="identifierForm" class="space-y-5">
          <div>
            <label for="identifier" class="block text-xs font-semibold text-slate-500 uppercase tracking-[0.16em] mb-2">
              Email or Phone
            </label>
            <input
              id="identifier"
              name="identifier"
              type="text"
              autocomplete="username"
              required
              class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-slate-900 placeholder-slate-400 transition focus:border-cyan-600 focus:outline-none focus:ring-4 focus:ring-cyan-100"
              placeholder="you@company.com or (555) 555-5555"
            />
          </div>

          <button id="requestCodeButton" type="submit" class="w-full btn-primary rounded-xl py-3 font-bold text-white">
            Send verification code
          </button>
        </form>

        <form id="codeForm" class="hidden space-y-5">
          <div>
            <label for="code" class="block text-xs font-semibold text-slate-500 uppercase tracking-[0.16em] mb-2">
              Verification Code
            </label>
            <input
              id="code"
              name="code"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              required
              maxlength="6"
              class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-center text-xl font-semibold tracking-[0.35em] text-slate-900 placeholder-slate-400 transition focus:border-cyan-600 focus:outline-none focus:ring-4 focus:ring-cyan-100"
              placeholder="000000"
            />
          </div>

          <button id="verifyCodeButton" type="submit" class="w-full btn-primary rounded-xl py-3 font-bold text-white">
            Verify Code
          </button>

          <button id="changeIdentifierButton" type="button" class="w-full text-sm font-semibold text-cyan-700 transition hover:text-cyan-900">
            Use a different email or phone
          </button>
        </form>

        <div id="messageBox" class="hidden mt-5 rounded-xl border p-4 text-sm"></div>

        <p class="mt-6 text-center text-xs leading-5 text-slate-500">
          Secure access for approved EngagePriority client admins.
        </p>
      </div>

      <footer class="mt-6 flex justify-center gap-5 text-xs text-slate-400">
        <a href="/privacy" class="transition hover:text-cyan-200">Privacy</a>
        <a href="/terms" class="transition hover:text-cyan-200">Terms</a>
      </footer>
    </section>
  </main>

  <script>
    const identifierForm = document.getElementById("identifierForm");
    const codeForm = document.getElementById("codeForm");
    const identifierInput = document.getElementById("identifier");
    const codeInput = document.getElementById("code");
    const requestCodeButton = document.getElementById("requestCodeButton");
    const verifyCodeButton = document.getElementById("verifyCodeButton");
    const changeIdentifierButton = document.getElementById("changeIdentifierButton");
    const messageBox = document.getElementById("messageBox");

    let currentIdentifier = "";

    function showMessage(type, text) {
      messageBox.classList.remove("hidden");
      messageBox.textContent = text;

      messageBox.className = "mt-5 rounded-xl border p-4 text-sm";

      if (type === "error") {
        messageBox.classList.add("border-red-200", "bg-red-50", "text-red-700");
        return;
      }

      messageBox.classList.add("border-emerald-200", "bg-emerald-50", "text-emerald-700");
    }

    function hideMessage() {
      messageBox.classList.add("hidden");
      messageBox.textContent = "";
    }

    function setRequestLoading(isLoading) {
      requestCodeButton.disabled = isLoading;
      requestCodeButton.textContent = isLoading ? "Sending..." : "Send verification code";
    }

    function setVerifyLoading(isLoading) {
      verifyCodeButton.disabled = isLoading;
      verifyCodeButton.textContent = isLoading ? "Verifying..." : "Verify Code";
    }

    identifierForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      hideMessage();

      currentIdentifier = String(identifierInput.value || "").trim();

      if (!currentIdentifier) {
        showMessage("error", "Enter your approved email address or phone number.");
        return;
      }

      setRequestLoading(true);

      try {
        const response = await fetch("/.netlify/functions/control-tower-request-code", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            identifier: currentIdentifier
          })
        });

        let result = {};
        try {
          result = await response.json();
        } catch (parseError) {
          result = {};
        }

        if (response.status === 429) {
          showMessage("error", "Too many code requests. Please try again later.");
          return;
        }

        if (!response.ok || result.ok === false) {
          showMessage("error", "The verification request could not be completed. Please try again later.");
          return;
        }

        identifierForm.classList.add("hidden");
        codeForm.classList.remove("hidden");
        codeInput.value = "";
        codeInput.focus();

        showMessage("success", result.message || "If this contact is approved, we will send a verification code.");
      } catch (error) {
        showMessage("error", "The verification request could not be completed. Please try again later.");
      } finally {
        setRequestLoading(false);
      }
    });

    codeForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      hideMessage();

      const code = String(codeInput.value || "").replace(/\D/g, "");

      if (code.length !== 6) {
        showMessage("error", "Enter the 6-digit verification code.");
        return;
      }

      setVerifyLoading(true);

      try {
        const response = await fetch("/.netlify/functions/control-tower-verify-code", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            identifier: currentIdentifier,
            code
          })
        });

        let result = {};
        try {
          result = await response.json();
        } catch (parseError) {
          result = {};
        }

        if (!response.ok || result.ok === false) {
          showMessage("error", "The code is invalid or expired. Please request a new code.");
          return;
        }

        window.location.href = result.redirect_to || "/control-tower";
      } catch (error) {
        showMessage("error", "The code could not be verified. Please try again later.");
      } finally {
        setVerifyLoading(false);
      }
    });

    changeIdentifierButton.addEventListener("click", () => {
      codeForm.classList.add("hidden");
      identifierForm.classList.remove("hidden");
      codeInput.value = "";
      currentIdentifier = "";
      hideMessage();
      identifierInput.focus();
    });
  </script>
</body>
</html>
