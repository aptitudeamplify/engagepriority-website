<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EngagePriority Control Tower Command Prototype</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f6f8fb;
      --ink: #172033;
      --muted: #647084;
      --panel: rgba(255,255,255,.94);
      --line: #d9e1eb;
      --brand: #0f766e;
      --brand-soft: #e7fbf7;
      --shadow: 0 18px 50px rgba(15,23,42,.11);
      --waiting-hours: #1F3A5F;
      --waiting-hours-soft: #dbe7f5;
      --new: #BFFBB6;
      --reminder: #D9EEFF;
      --outcome: #E8E0FF;
      --risk: #FFF0B8;
      --escalated: #FFD6D6;
      --resolved: #E9EDF2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(15,118,110,.15), transparent 26rem),
        radial-gradient(circle at 88% 0%, rgba(31,58,95,.12), transparent 30rem),
        var(--page);
      color: var(--ink);
    }
    button { font: inherit; }
    .shell { width: min(1540px, calc(100% - 28px)); margin: 0 auto; padding: 18px 0 54px; }
    .topbar {
      position: sticky;
      top: 12px;
      z-index: 30;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 16px 18px;
      border: 1px solid rgba(217,225,235,.88);
      border-radius: 26px;
      background: rgba(255,255,255,.91);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }
    .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .brand-mark { width: 42px; height: 42px; border-radius: 15px; display: grid; place-items: center; color: white; font-weight: 900; background: linear-gradient(135deg, #0f766e, #0891b2); letter-spacing: -.06em; }
    .eyebrow { margin: 0 0 4px; font-size: .72rem; font-weight: 850; letter-spacing: .17em; text-transform: uppercase; color: var(--brand); }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 0; font-size: clamp(1.5rem, 3vw, 2.35rem); letter-spacing: -.045em; }
    .review-pill { padding: 9px 12px; border: 1px solid #b7ddd7; border-radius: 999px; background: var(--brand-soft); color: #0f5f59; font-size: .82rem; font-weight: 800; white-space: nowrap; }
    .summary-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 18px 0; }
    .metric { min-height: 80px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 21px; background: var(--panel); box-shadow: 0 10px 30px rgba(15,23,42,.06); }
    .metric span { display: block; margin-bottom: 7px; color: var(--muted); font-size: .7rem; font-weight: 850; letter-spacing: .11em; text-transform: uppercase; }
    .metric strong { display: block; font-size: clamp(1.45rem, 3vw, 2.15rem); letter-spacing: -.05em; }
    .viewbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; padding: 12px; border: 1px solid var(--line); border-radius: 24px; background: var(--panel); box-shadow: 0 12px 35px rgba(15,23,42,.07); }
    .view-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .view-tab { border: 1px solid var(--line); border-radius: 999px; padding: 9px 13px; background: white; color: #42526a; font-weight: 850; cursor: pointer; }
    .view-tab[aria-pressed="true"] { border-color: transparent; background: linear-gradient(135deg, #0f766e, #0891b2); color: white; }
    .view-note { color: var(--muted); font-size: .88rem; }
    .legend { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
    .legend-chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.82); color: #405069; font-size: .78rem; font-weight: 750; }
    .legend-dot { width: 13px; height: 13px; border-radius: 999px; border: 1px solid rgba(15,23,42,.15); }
    .legend-chip.dark { background: #263f62; color: #fff; border-color: #1f3a5f; }
    .stage-stack, .agent-stack { display: grid; gap: 15px; }
    .row-panel { border: 1px solid var(--line); border-radius: 24px; background: var(--panel); box-shadow: 0 16px 44px rgba(15,23,42,.08); overflow: hidden; }
    .row-panel.escalated { border-color: #ffc2c2; box-shadow: 0 18px 48px rgba(185,28,28,.13); }
    .row-panel.business-hours { border-color: #334e74; box-shadow: 0 18px 48px rgba(31,58,95,.16); }
    .row-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 15px 18px 8px; }
    .row-title { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .stage-dot { width: 14px; height: 14px; border-radius: 999px; border: 1px solid rgba(15,23,42,.16); flex: 0 0 auto; }
    .row-head h2 { margin: 0; font-size: clamp(1.05rem, 1.8vw, 1.4rem); letter-spacing: -.035em; }
    .row-subtext { color: var(--muted); font-size: .86rem; font-weight: 650; }
    .agent-headline { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 48px; height: 48px; border-radius: 17px; display: grid; place-items: center; color: white; font-weight: 900; background: linear-gradient(145deg, #0f766e, #7c3aed); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35), 0 10px 22px rgba(15,23,42,.13); overflow: hidden; flex: 0 0 auto; }
    .avatar.admin { background: linear-gradient(145deg, #991b1b, #fb7185); }
    .avatar.hold { background: linear-gradient(145deg, #1f3a5f, #0f172a); }
    .portrait-photo { position: relative; background: linear-gradient(145deg, #e7eef8, #f9fbff); color: transparent; }
    .portrait-photo::before { content: ""; position: absolute; inset: 6px 8px 9px; border-radius: 14px; background: var(--portrait-bg); box-shadow: inset 0 0 0 1px rgba(255,255,255,.45); }
    .portrait-photo::after { content: ""; position: absolute; left: 15px; top: 9px; width: 18px; height: 18px; border-radius: 999px; background: var(--portrait-face); box-shadow: 0 18px 0 7px var(--portrait-face), 0 3px 0 9px var(--portrait-hair); }
    .portrait-maya { --portrait-bg: linear-gradient(160deg, #9ccfd1, #effaf8 70%); --portrait-face: #bd7b55; --portrait-hair: #1f2937; }
    .portrait-jordan { --portrait-bg: linear-gradient(160deg, #a8c7ff, #f4f7ff 72%); --portrait-face: #8b5e3c; --portrait-hair: #2f241f; }
    .portrait-sofia { --portrait-bg: linear-gradient(160deg, #f7b3bd, #fff6f8 72%); --portrait-face: #d49a6a; --portrait-hair: #5b2b22; }
    .agent-metrics { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .agent-metric { padding: 7px 9px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: #405069; font-size: .78rem; font-weight: 800; }
    .carousel { position: relative; }
    .cards-track { display: grid; grid-auto-flow: column; grid-auto-columns: clamp(170px, 15.8%, 225px); gap: 11px; overflow-x: auto; padding: 5px 18px 18px; scroll-behavior: smooth; scrollbar-width: thin; }
    .side-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(430px, 100%), 1fr)); gap: 14px; align-items: start; }
    .side-pane { min-width: 0; }
    .side-pane .cards-track { grid-auto-columns: clamp(132px, 31%, 186px); gap: 9px; padding-inline: 14px; }
    .side-pane .row-head { padding-inline: 14px; }
    .side-pane .row-subtext { display: none; }
    .side-pane .agent-metrics { display: none; }
    .rail-arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 5; width: 38px; height: 58px; border: 1px solid rgba(15,23,42,.12); border-radius: 18px; background: rgba(255,255,255,.88); color: #18324c; font-size: 1.7rem; line-height: 1; font-weight: 900; box-shadow: 0 12px 30px rgba(15,23,42,.16); cursor: pointer; display: none; }
    .rail-arrow.visible { display: grid; place-items: center; }
    .rail-arrow.left { left: 8px; }
    .rail-arrow.right { right: 8px; }
    .lead-card { width: 100%; min-height: 148px; border: 1px solid rgba(15,23,42,.13); border-radius: 20px; padding: 13px; text-align: left; color: #182238; box-shadow: 0 12px 26px rgba(15,23,42,.08); cursor: pointer; display: grid; align-content: space-between; gap: 9px; }
    .lead-card:hover, .lead-card:focus-visible { outline: 3px solid rgba(8,145,178,.25); transform: translateY(-1px); }
    .lead-card[data-stage="Waiting for Business Hours"] { background: var(--waiting-hours); color: white; border-color: #20334f; }
    .lead-card[data-stage="Waiting for Business Hours"] .lead-name { color: white; font-weight: 900; }
    .lead-card[data-stage="Waiting for Business Hours"] .lead-meta { color: #edf5ff; }
    .lead-card[data-stage="Waiting for Business Hours"] .context { color: white; border-color: rgba(255,255,255,.22); }
    .lead-card[data-stage="Waiting for Business Hours"] .status-line { color: white; border-color: rgba(255,255,255,.30); background: rgba(255,255,255,.12); }
    .lead-card[data-stage="New"] { background: var(--new); }
    .lead-card[data-stage="Reminder Sent"] { background: var(--reminder); }
    .lead-card[data-stage="Waiting for Outcome Response"] { background: var(--outcome); }
    .lead-card[data-stage="At Risk"] { background: var(--risk); }
    .lead-card[data-stage="Escalated to Admin"] { background: var(--escalated); }
    .lead-card[data-stage="Resolved"] { background: var(--resolved); }
    .lead-name { margin: 0 0 5px; font-size: 1rem; line-height: 1.14; letter-spacing: -.025em; }
    .lead-meta { display: grid; gap: 3px; color: #344358; font-size: .8rem; line-height: 1.24; }
    .context { border-top: 1px solid rgba(15,23,42,.12); padding-top: 8px; color: #24344a; font-size: .8rem; font-weight: 750; line-height: 1.25; }
    .status-line { display: inline-flex; width: fit-content; margin-bottom: 7px; padding: 4px 7px; border-radius: 999px; border: 1px solid rgba(15,23,42,.15); background: rgba(255,255,255,.55); color: #25344a; font-size: .66rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
    .card-agent { display: block; }
    .agent-mode .card-agent, .side-agent .card-agent { display: none; }
    .empty-state { margin: 4px 18px 18px; padding: 18px; border: 1px dashed var(--line); border-radius: 18px; color: var(--muted); background: rgba(255,255,255,.64); font-weight: 700; }
    .row-panel.business-hours .empty-state { border-color: #49698f; background: rgba(31,58,95,.07); color: #2e4667; }
    .overlay { position: fixed; inset: 0; z-index: 80; display: none; padding: 5vh 5vw; background: rgba(15,23,42,.46); backdrop-filter: blur(6px); }
    .overlay.open { display: grid; place-items: center; }
    .workspace { width: min(1180px, 84vw); height: min(820px, 84vh); overflow: auto; border: 1px solid rgba(255,255,255,.5); border-radius: 32px; background: rgba(255,255,255,.96); box-shadow: 0 30px 90px rgba(15,23,42,.32); }
    .workspace-head { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; padding: 24px 26px 18px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.94); backdrop-filter: blur(12px); }
    .workspace-head h2 { margin: 0 0 6px; font-size: clamp(1.7rem, 4vw, 2.7rem); letter-spacing: -.055em; }
    .close-button { border: 1px solid var(--line); border-radius: 15px; background: #fff; padding: 10px 13px; font-weight: 850; cursor: pointer; }
    .workspace-body { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 16px; padding: 18px 24px 26px; }
    .detail-panel { border: 1px solid var(--line); border-radius: 24px; background: #fbfdff; padding: 17px; }
    .detail-panel h3 { margin-bottom: 13px; font-size: 1rem; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
    .detail-item span { display: block; margin-bottom: 4px; color: var(--muted); font-size: .69rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
    .detail-item strong { display: block; color: var(--ink); line-height: 1.35; }
    .timeline { display: grid; gap: 10px; }
    .event { position: relative; padding: 12px 12px 12px 15px; border: 1px solid var(--line); border-left: 5px solid var(--brand); border-radius: 16px; background: #fff; }
    .event strong { display: block; margin-bottom: 3px; }
    .event span { color: var(--muted); font-size: .86rem; }
    .resolution { background: #fff7f7; border-color: #ffc7c7; }
    .resolution-actions { display: grid; gap: 9px; margin-top: 12px; }
    .resolution-actions button { border: 1px solid #f3b5b5; border-radius: 14px; background: white; padding: 9px 11px; color: #7f1d1d; font-weight: 850; cursor: pointer; text-align: left; }
    .contact-hidden { padding: 12px; border: 1px dashed #e99b9b; border-radius: 16px; background: #fff; color: #7f1d1d; font-weight: 750; }
    .boundary { margin: 18px 2px 0; color: var(--muted); font-size: .82rem; line-height: 1.5; }
    @media (max-width: 1150px) { .cards-track { grid-auto-columns: clamp(168px, 22%, 222px); } }
    @media (max-width: 760px) { .topbar, .viewbar { grid-template-columns: 1fr; flex-direction: column; align-items: flex-start; } .summary-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cards-track, .side-pane .cards-track { grid-auto-columns: clamp(164px, 44%, 218px); } .workspace-body { grid-template-columns: 1fr; } }
    @media (max-width: 640px) { .shell { width: min(100% - 18px, 1540px); padding-top: 8px; } .review-pill { white-space: normal; } .summary-strip { grid-template-columns: 1fr 1fr; } .row-head, .workspace-head { flex-direction: column; align-items: flex-start; } .agent-metrics { justify-content: flex-start; } .overlay { padding: 0; } .workspace { width: 100vw; height: 100vh; border-radius: 0; } .detail-grid { grid-template-columns: 1fr; } .lead-card { min-height: 142px; } }
    @media (prefers-reduced-motion: reduce) { .cards-track { scroll-behavior: auto; } .lead-card:hover, .lead-card:focus-visible { transform: none; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar" aria-label="Control Tower header">
      <div class="brand"><div class="brand-mark" aria-hidden="true">EP</div><div><p class="eyebrow">Control Tower</p><h1>Active work command view</h1></div></div>
      <span class="review-pill">Design review surface</span>

    <section class="summary-strip" id="summaryStrip" aria-label="Operational summary metrics"></section>

    <section class="viewbar" aria-label="View selection">
      <div class="view-tabs">
        <button class="view-tab" type="button" data-view="lifecycle" aria-pressed="true">Lifecycle View</button>
        <button class="view-tab" type="button" data-view="agent" aria-pressed="false">Agent View</button>
        <button class="view-tab" type="button" data-view="side" aria-pressed="false">Side-by-Side View</button>

      <div class="view-note">Current active work only</div>

    <section class="legend" id="legend" aria-label="Lifecycle color guide"></section>
    <main id="workspace" aria-live="polite"></main>

      { id: "L-2313", name: "Avery Bennett", phone: "(713) ***-5811", submitted: "Today, 11:42 PM", sort: 2342, agent: "hold", stage: "Waiting for Business Hours", context: "Held until service opens", source: "Website Form", offHours: true, events: [["11:42 PM", "Lead arrived after service window closed"], ["11:42 PM", "Held for opening release"]] },
      { id: "L-2314", name: "Mei Lawson", phone: "(832) ***-7764", submitted: "Today, 11:51 PM", sort: 2351, agent: "hold", stage: "Waiting for Business Hours", context: "Release at opening", source: "Realtor.com", offHours: true, events: [["11:51 PM", "Lead arrived after service window closed"], ["11:51 PM", "Release queued for next service window"]] },
      { id: "L-2299", name: "Resolved sample", phone: "(713) ***-0000", submitted: "Earlier today", sort: 700, agent: "alex", stage: "Resolved", context: "Closed, hidden from active rows", source: "History", inactive: true, events: [["7:00 AM", "Lead received"], ["7:06 AM", "Appointment set"], ["7:07 AM", "Resolved"]] }
    ];

    const activeLeads = leads.filter((lead) => !lead.inactive && (lead.stage !== "Waiting for Business Hours" || !serviceWindowOpen));
    let currentView = "lifecycle";

    const workspace = document.getElementById("workspace");
    const summaryStrip = document.getElementById("summaryStrip");
    const legend = document.getElementById("legend");
    const overlay = document.getElementById("leadOverlay");
    const closeOverlay = document.getElementById("closeOverlay");

    function esc(value) {
      return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }

    function agentFor(id) { return agents[id] || agents.admin; }

    function renderSummary() {
      const escalated = activeLeads.filter((lead) => lead.stage === "Escalated to Admin").length;
      const risk = activeLeads.filter((lead) => lead.stage === "At Risk").length;
      const metrics = [["Active Leads", activeLeads.length], ["At Risk", risk], ["Escalated to Admin", escalated], ["Avg. Response Time", "16m"]];
      summaryStrip.innerHTML = metrics.map(([label, value]) => `<article class="metric"><span>${esc(label)}</span><strong>${esc(value)}</strong></article>`).join("");
    }

    function renderLegend() {
      legend.innerHTML = Object.entries(lifecycle).map(([stage, info]) => `<span class="legend-chip ${stage === "Waiting for Business Hours" ? "dark" : ""}"><span class="legend-dot" style="background:${info.color}"></span>${esc(stage)}</span>`).join("");
    }

    function agentPortrait(agent) {
      if (agent.photoClass) return `<div class="avatar portrait-photo ${agent.photoClass}" role="img" aria-label="Mock portrait for ${esc(agent.name)}"></div>`;
      const mode = agent.admin ? "admin" : agent.hold ? "hold" : "";
      return `<div class="avatar ${mode}" aria-label="${esc(agent.name)} initials fallback">${esc(agent.initials)}</div>`;
    }

    function renderRow({ title, subtitle, items, dot, escalated = false, businessHours = false, mode = "lifecycle", emptyText = "No active leads in this stage" }) {
      const cards = [...items].sort((a, b) => a.sort - b.sort).map((lead) => renderCard(lead, mode)).join("");
      return `<section class="row-panel ${escalated ? "escalated" : ""} ${businessHours ? "business-hours" : ""}">
        <header class="row-head">
          <div class="row-title">${dot}<div><h2>${esc(title)}</h2><div class="row-subtext">${esc(subtitle)}</div></div></div>
        </header>
        ${items.length ? `<div class="carousel" data-carousel>
          <button class="rail-arrow left" type="button" aria-label="Scroll left" data-scroll="left">‹</button>
          <div class="cards-track">${cards}</div>
          <button class="rail-arrow right" type="button" aria-label="Scroll right" data-scroll="right">›</button>
        </div>` : `<div class="empty-state">${esc(emptyText)}</div>`}
      </section>`;
    }

    function renderCard(lead, mode) {
      const agent = agentFor(lead.agent);
      const showStatusLine = mode !== "lifecycle" || lead.stage === "Waiting for Business Hours";
      return `<button class="lead-card" type="button" data-lead-id="${esc(lead.id)}" data-stage="${esc(lead.stage)}" aria-label="Open ${esc(lead.name)} detail">
        <div>
          ${showStatusLine ? `<span class="status-line">${esc(lead.stage)}</span>` : ""}
          <h3 class="lead-name">${esc(lead.name)}</h3>
          <div class="lead-meta">
            <span>${esc(lead.phone)}</span>
            <span>${esc(lead.submitted)}</span>
            <span class="card-agent">${esc(agent.name)}</span>
          </div>
        </div>
        <div class="context">${esc(lead.context)}</div>
      </button>`;
    }

    function renderLifecycleView(prefix = "") {
      const rows = lifecycleOrder.map((stage) => {
        const items = activeLeads.filter((lead) => lead.stage === stage);
        const info = lifecycle[stage];
        const title = stage === "Escalated to Admin" ? "Exceptions / Escalated-to-Admin" : stage;
        const subtitle = stage === "Waiting for Business Hours" && serviceWindowOpen ? "0 held leads. Service window is open." : `${items.length} active lead${items.length === 1 ? "" : "s"}. ${info.description}.`;
        return renderRow({ title, subtitle, items, dot: `<span class="stage-dot" style="background:${info.color}" aria-hidden="true"></span>`, escalated: stage === "Escalated to Admin", businessHours: stage === "Waiting for Business Hours", mode: prefix ? "side-lifecycle" : "lifecycle", emptyText: stage === "Waiting for Business Hours" ? "No leads are currently being held for business hours." : "No active leads in this stage." });
      });
      return `<div class="stage-stack ${prefix}">${rows.join("")}</div>`;
    }

    function renderAgentHeader(agent, count) {
      return `<div class="agent-headline">${agentPortrait(agent)}<div><h2>${esc(agent.name)}</h2><div class="row-subtext">${count} active lead${count === 1 ? "" : "s"}</div></div></div>`;
    }

    function renderAgentView(prefix = "") {
      const agentOrder = [agents.admin, agents.hold, agents.maya, agents.jordan, agents.alex, agents.sofia];
      const rows = agentOrder.map((agent) => {
        const items = activeLeads.filter((lead) => lead.agent === agent.id);
        return `<section class="row-panel ${agent.admin ? "escalated" : ""} ${agent.hold ? "business-hours" : ""}">
          <header class="row-head">
            <div class="row-title">${renderAgentHeader(agent, items.length)}</div>
            <div class="agent-metrics"><span class="agent-metric">Avg. Response: ${esc(agent.avgResponse)}</span><span class="agent-metric">Reassignments: ${esc(agent.reassignments)}</span></div>
          </header>
          ${items.length ? `<div class="carousel" data-carousel>
            <button class="rail-arrow left" type="button" aria-label="Scroll left" data-scroll="left">‹</button>
            <div class="cards-track">${[...items].sort((a,b) => a.sort - b.sort).map((lead) => renderCard(lead, prefix ? "side-agent" : "agent")).join("")}</div>
            <button class="rail-arrow right" type="button" aria-label="Scroll right" data-scroll="right">›</button>
          </div>` : `<div class="empty-state">No active leads in this row.</div>`}
        </section>`;
      });
      return `<div class="agent-stack agent-mode ${prefix}">${rows.join("")}</div>`;
    }

    function renderWorkspace() {
      document.querySelectorAll(".view-tab").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.view === currentView)));
      if (currentView === "agent") workspace.innerHTML = renderAgentView();
      else if (currentView === "side") workspace.innerHTML = `<section class="side-grid"><div class="side-pane"><p class="eyebrow">Lifecycle perspective</p>${renderLifecycleView("side-lifecycle")}</div><div class="side-pane"><p class="eyebrow">Agent perspective</p>${renderAgentView("side-agent")}</div></section>`;
      else workspace.innerHTML = renderLifecycleView();
      wireCarousels();
    }

    function detailItem(label, value) { return `<div class="detail-item"><span>${esc(label)}</span><strong>${esc(value || "-")}</strong></div>`; }

    function openLead(lead) {
      const agent = agentFor(lead.agent);
      document.getElementById("detailTitle").textContent = lead.name;
      document.getElementById("detailSubtitle").textContent = `${lead.stage} / ${lead.context}`;
      document.getElementById("summaryDetail").innerHTML = [detailItem("Phone", lead.phone), detailItem("Submitted", lead.submitted), detailItem("Source", lead.source), detailItem("Lead", lead.id)].join("");
      document.getElementById("statusDetail").innerHTML = [detailItem("Lifecycle", lead.stage), detailItem("Next Action", lead.context), detailItem("Escalation Reason", lead.escalationReason || "Not escalated"), detailItem("Read-only", lead.eligibleAdminResolution ? "Admin resolution available" : "Normal lead")].join("");
      document.getElementById("agentDetail").innerHTML = [detailItem("Assigned Context", agent.name), detailItem("Avg. Response", agent.avgResponse), detailItem("Reassignments", agent.reassignments), detailItem("Reassignment History", lead.reassignedHistory ? "Reassigned, now fresh New cycle" : "None shown")].join("");
      document.getElementById("timelineDetail").innerHTML = lead.events.map(([time, text]) => `<div class="event"><strong>${esc(text)}</strong><span>${esc(time)}</span></div>`).join("");
      renderResolutionPanel(lead);
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      closeOverlay.focus();
    }

    function renderResolutionPanel(lead) {
      const panel = document.getElementById("resolutionPanel");
      if (!lead.eligibleAdminResolution) {
        panel.className = "detail-panel";
        panel.innerHTML = `<h3>Administrator resolution</h3><p class="row-subtext">This lead is read-only because it is not escalated to administrator intervention.</p>`;
        return;
      }
      panel.className = "detail-panel resolution";
      panel.innerHTML = `<h3>Administrator resolution</h3><div class="contact-hidden" id="contactBlock">Contact and resolution details are hidden until explicitly revealed.</div><div class="resolution-actions"><button type="button" id="revealContact">Reveal contact details</button><button type="button">Contacted, Appointment Set</button><button type="button">Contacted, Not Interested</button><button type="button">No Answer, Admin Attempted</button><button type="button">No Action, Admin Closed</button></div>`;
      document.getElementById("revealContact").addEventListener("click", () => {
        document.getElementById("contactBlock").textContent = `${lead.phone} / safe display contact shown for eligible escalated lead`;
      });
    }

    function closeLead() {
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
    }

    function wireCarousels() {
      document.querySelectorAll("[data-carousel]").forEach((carousel) => {
        const track = carousel.querySelector(".cards-track");
        const left = carousel.querySelector(".rail-arrow.left");
        const right = carousel.querySelector(".rail-arrow.right");
        const update = () => {
          const max = Math.max(0, track.scrollWidth - track.clientWidth - 2);
          left.classList.toggle("visible", track.scrollLeft > 2);
          right.classList.toggle("visible", track.scrollLeft < max);
        };
        left.addEventListener("click", () => track.scrollBy({ left: -Math.round(track.clientWidth * .86), behavior: "smooth" }));
        right.addEventListener("click", () => track.scrollBy({ left: Math.round(track.clientWidth * .86), behavior: "smooth" }));
        track.addEventListener("scroll", update, { passive: true });
        window.addEventListener("resize", update);
        requestAnimationFrame(update);
      });
    }

    document.querySelectorAll(".view-tab").forEach((button) => button.addEventListener("click", () => { currentView = button.dataset.view; renderWorkspace(); }));
    workspace.addEventListener("click", (event) => {
      const card = event.target.closest("[data-lead-id]");
      if (!card) return;
      const lead = activeLeads.find((item) => item.id === card.dataset.leadId);
      if (lead) openLead(lead);
    });
    closeOverlay.addEventListener("click", closeLead);
    overlay.addEventListener("click", (event) => { if (event.target === overlay) closeLead(); });
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeLead(); });

    renderSummary();
    renderLegend();
    renderWorkspace();
  </script>
</body>
</html>
